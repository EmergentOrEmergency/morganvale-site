<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La sala — Prima di premere invio · Morgan Vale</title>
<meta name="description" content="Una sala server da attraversare a piedi. Diciannove armadi, diciannove storie documentate.">
<meta name="theme-color" content="#03050a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23070b14'/%3E%3Ccircle cx='6' cy='16' r='3' fill='%23a8a49b'/%3E%3Ccircle cx='16' cy='16' r='3.5' fill='%23e8e2d3'/%3E%3Ccircle cx='26' cy='16' r='3' fill='%23a8a49b'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Mono:wght@400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="../stage.css">
<link rel="stylesheet" href="sala.css">
</head>
<body class="sala">

<canvas id="c" aria-label="Sala server in 3D"></canvas>
<div class="film" aria-hidden="true"></div>

<header class="sala-top">
  <a class="brand" href="../">Morgan Vale</a>
  <a class="esci" href="../">Esci ✕</a>
</header>

<noscript><p class="fail">La sala richiede JavaScript. <a href="../">Torna al sito</a>.</p></noscript>
<p class="fail" id="fail" hidden><a href="../">Torna al sito</a></p>

<div class="intro-msg" id="intro-msg">
  <p>Un messaggio è pronto. Nessuno l'ha ancora inviato.</p>
  <button id="send" type="button">Premi Invio</button>
</div>

<p class="caption" id="caption" aria-live="polite"></p>
<p class="hint" id="hint" hidden>Trascina per guardarti intorno · W A S D o frecce per camminare · clic su un armadio per aprirlo</p>

<div class="pad" id="pad" hidden>
  <button id="go-f" aria-label="Avanti">▲</button>
  <button id="go-b" aria-label="Indietro">▼</button>
</div>

<div class="stage" id="stage" role="dialog" aria-modal="true" aria-label="Storia" hidden>
  <button class="stage-close" id="stage-close" aria-label="Chiudi">Chiudi ✕</button>
  <div class="stage-body">
    <p class="stage-theme" id="stage-theme"></p>
    <h3 id="stage-title"></h3>
    <p class="stage-text" id="stage-text"></p>
    <p class="stage-src" id="stage-src">Fonti e cronologia complete: pagina del caso in arrivo.</p>
    <a class="stage-link" id="stage-link" href="#" hidden>Leggi l'estratto e le fonti →</a>
  </div>
  <div class="stage-bar">
    <span class="stage-count" id="stage-count"></span>
    <span class="stage-nav"><button id="stage-prev" aria-label="Storia precedente">←</button><button id="stage-next" aria-label="Storia successiva">→</button></span>
  </div>
</div>

<script type="module" src="sala.js"></script>
</body>
</html>
