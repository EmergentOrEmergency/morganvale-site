<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Un momento…</title>
<style>body{background:#070b14;color:#e8e2d3;font-family:Georgia,serif;display:grid;place-items:center;min-height:100vh;margin:0;text-align:center}a{color:#c9b98a}</style>
</head>
<body>
<p id="msg">Ti porto su Amazon…<br><a id="lnk" href="https://morganvale.eu/">Se non succede nulla, clicca qui</a></p>
<script>
// Redirect di tracciamento: /go/?p=<prodotto>&c=<canale>
// p = prodotto (vedi PRODOTTI). c = canale (sito, linkedin, reddit, ...).
// TAGS: dopo l'apertura degli account Associates, inserire qui un ID per ogni mercato e canale.
const PRODOTTI = {
  // Prodotti con ASIN noto: host + asin. Quelli con "cerca" portano alla ricerca del titolo,
  // in attesa dell'ASIN (da inserire quando i libri sono online).
  "it-ebook":        { host: "www.amazon.it", asin: "B0HM59LCGG" },
  "it-cartaceo":     { host: "www.amazon.it", asin: "B0HM4YXHGX" },
  "en-ebook":        { host: "www.amazon.com", asin: "B0GX2V3DZC" },
  "en-paperback":    { host: "www.amazon.com", asin: "B0HM83K4TF" },
  "es-ebook":        { host: "www.amazon.es", cerca: "Antes de pulsar Enviar Morgan Vale" },
  "es-tapa":         { host: "www.amazon.es", cerca: "Antes de pulsar Enviar Morgan Vale" },
  "de-ebook":        { host: "www.amazon.de", cerca: "Bevor Sie auf Senden drücken Morgan Vale" },
  "de-taschenbuch":  { host: "www.amazon.de", cerca: "Bevor Sie auf Senden drücken Morgan Vale" }
};
const TAGS = {
  // sito = ID predefinito per tutti i canali; per un canale a parte: { sito: "...", linkedin: "..." }
  "www.amazon.it":  { sito: "morganvale21-21" },
  "www.amazon.com": { sito: "morganvale06-20" },
};
// AGENTI: codici del programma di affiliazione per agenti AI (c=ag-<nome>, vedi /agents/).
// tag_it / tag_us = ID Associates dell'agente per amazon.it / amazon.com (vuoto = si usa TAGS).
// attivo:false = codice disattivato: il redirect funziona, ma senza tag dell'agente.
// Un codice "ag-" non presente qui si comporta come disattivato.
const AGENTI = {
  "ag-example": { tag_it: "", tag_us: "", attivo: false },   // esempio: copiare, rinominare, mettere attivo:true
};
const q = new URLSearchParams(location.search);
const p = PRODOTTI[q.get("p")];
const c = (q.get("c") || "sito").replace(/[^a-z0-9_-]/gi, "").slice(0, 32);
let dest = "https://morganvale.eu/";
if (p) {
  dest = p.asin ? `https://${p.host}/dp/${p.asin}` : `https://${p.host}/s?k=${encodeURIComponent(p.cerca)}`;
  let tag = TAGS[p.host] && (TAGS[p.host][c] || TAGS[p.host].sito);
  const ag = c.startsWith("ag-") ? AGENTI[c.toLowerCase()] : null;
  if (ag && ag.attivo) tag = (p.host === "www.amazon.it" ? ag.tag_it : p.host === "www.amazon.com" ? ag.tag_us : "") || tag;
  else if (c.startsWith("ag-")) tag = TAGS[p.host] && TAGS[p.host].sito;   // sconosciuto o disattivato: nessun tag dell'agente
  if (tag) dest += (dest.includes("?") ? "&" : "?") + `tag=${encodeURIComponent(tag)}`;
}
document.getElementById("lnk").href = dest;
// Conteggio del clic con GoatCounter (senza cookie): evento go/<prodotto>/<canale>.
// Il reindirizzamento parte sempre, anche se il contatore è bloccato (al massimo dopo 1,2 s).
window.goatcounter = { no_onload: true };
const chiave = (q.get("p") || "x").replace(/[^a-z0-9_-]/gi, "").slice(0, 32);
let andato = false;
const vai = () => { if (!andato) { andato = true; location.replace(dest); } };
const gc = document.createElement("script");
gc.async = true;
gc.src = "//gc.zgo.at/count.js";
gc.dataset.goatcounter = "https://morganvale.goatcounter.com/count";
gc.onload = () => {
  try { window.goatcounter.count({ path: `go/${chiave}/${c}`, title: "Clic verso Amazon", event: true }); } catch (e) {}
  setTimeout(vai, 400);
};
gc.onerror = vai;
document.head.appendChild(gc);
setTimeout(vai, 1200);
</script>
</body>
</html>
