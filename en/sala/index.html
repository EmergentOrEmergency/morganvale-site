<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Room — Before You Press Send · Morgan Vale</title>
<meta name="description" content="A server room to walk through. Nineteen racks, nineteen documented stories.">
<link rel="canonical" href="https://morganvale.eu/en/sala/">
<link rel="alternate" hreflang="it" href="https://morganvale.eu/sala/">
<link rel="alternate" hreflang="en" href="https://morganvale.eu/en/sala/">
<link rel="alternate" hreflang="x-default" href="https://morganvale.eu/sala/">
<meta name="theme-color" content="#03050a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23070b14'/%3E%3Ccircle cx='6' cy='16' r='3' fill='%23a8a49b'/%3E%3Ccircle cx='16' cy='16' r='3.5' fill='%23e8e2d3'/%3E%3Ccircle cx='26' cy='16' r='3' fill='%23a8a49b'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Mono:wght@400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/stage.css">
<link rel="stylesheet" href="/sala/sala.css">
</head>
<body class="sala">

<canvas id="c" aria-label="Server room in 3D"></canvas>
<div class="film" aria-hidden="true"></div>

<header class="sala-top">
  <a class="brand" href="/en/">Morgan Vale</a>
  <a class="esci" href="/en/">Exit ✕</a>
</header>

<noscript><p class="fail">The room needs JavaScript. <a href="/en/">Back to the site</a>.</p></noscript>
<p class="fail" id="fail" hidden><a href="/en/">Back to the site</a></p>

<div class="intro-msg" id="intro-msg">
  <p>A message is ready. No one has sent it yet.</p>
  <button id="send" type="button">Press Enter</button>
</div>

<p class="caption" id="caption" aria-live="polite"></p>
<p class="hint" id="hint" hidden>Drag to look around · W A S D or arrow keys to walk · click a rack to open it</p>

<div class="pad" id="pad" hidden>
  <button id="go-f" aria-label="Forward">▲</button>
  <button id="go-b" aria-label="Back">▼</button>
</div>

<div class="stage" id="stage" role="dialog" aria-modal="true" aria-label="Story" hidden>
  <button class="stage-close" id="stage-close" aria-label="Close ✕">Close ✕</button>
  <div class="stage-body">
    <p class="stage-theme" id="stage-theme"></p>
    <h3 id="stage-title"></h3>
    <p class="stage-text" id="stage-text"></p>
    <p class="stage-src" id="stage-src">Full sources and timeline: the story page is coming soon.</p>
    <a class="stage-link" id="stage-link" href="#" hidden>Read the excerpt and the sources →</a>
  </div>
  <div class="stage-bar">
    <span class="stage-count" id="stage-count"></span>
    <span class="stage-nav"><button id="stage-prev" aria-label="Previous story">←</button><button id="stage-next" aria-label="Next story">→</button></span>
  </div>
</div>

<script type="module" src="/sala/sala.js"></script>
</body>
</html>
